name: Weekly Zombie Resource Scan

on:
  # Run every Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  scan-resources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Run zombie resource scan
        run: |
          python src/main.py --format json > scan-results.json
      
      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombie-scan-results-${{ github.run_number }}
          path: |
            scan-results.json
            reports/
          retention-days: 90
      
      - name: Check for zombies and create issue (optional)
        if: success()
        run: |
          # Count zombies from JSON output
          ZOMBIE_COUNT=$(python -c "import json; data=json.load(open('scan-results.json')); print(data['summary']['total_zombies'])" 2>/dev/null || echo "0")
          
          if [ "$ZOMBIE_COUNT" -gt "0" ]; then
            echo "⚠️ Found $ZOMBIE_COUNT zombie resources!"
            echo "ZOMBIE_COUNT=$ZOMBIE_COUNT" >> $GITHUB_ENV
          else
            echo "✅ No zombie resources found"
          fi
      
      - name: Post summary
        if: success()
        run: |
          echo "## 🧟 Weekly Zombie Resource Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python scripts/generate-summary.py >> $GITHUB_STEP_SUMMARY